volumes:
  postgres-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${DOCKER_VOL_POSTGRES_DATA:-${PWD}/data/postgres/16/db}'
  redis-data:
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${DOCKER_VOL_REDIS_DATA:-${PWD}/data/redis/db}'

services:
  postgres:
    image: ${POSTGRES_DOCKER_IMAGE:-postgres:16-alpine}
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: ${REDIS_DOCKER_IMAGE:-redis:8.4-alpine}
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./data/redis/conf/redis.conf.template:/usr/local/etc/redis/redis.conf.template
      - ./data/certbot/conf/:/etc/letsencrypt
    command: /bin/sh -c "sed -e 's/$$HOSTNAME/${REDIS_HOST:-redis}.${DOMAIN_NAME:-user.blindside-ps.dev}/' /usr/local/etc/redis/redis.conf.template > /usr/local/etc/redis/redis.conf && exec redis-server --appendonly yes"

  certbot:
    image: ${CERTBOT_DOCKER_IMAGE:-certbot/certbot}
    container_name: certbot
    volumes:
      - ./log/certbot/:/var/log/letsencrypt
      - ./data/certbot/conf/:/etc/letsencrypt
      - ./data/certbot/www/:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  scalelite-proxy:
    image: ${NGINX_DOCKER_IMAGE:-nginx:1.29}
    container_name: scalelite-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOSTNAME=${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}
    volumes:
      - ./log/scalelite-proxy/:/var/log/nginx
      - ./data/proxy/nginx/sites.template.${DOCKER_PROXY_NGINX_TEMPLATE:-scalelite-proxy}:/etc/nginx/sites.template
      - ./data/proxy/nginx/sites-common:/etc/nginx/sites-common
      - ./data/certbot/conf/:/etc/letsencrypt
      - ./data/certbot/www/:/var/www/certbot
      - ./docker/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh
    depends_on:
      - certbot
      - scalelite-api
      - scalelite-recordings
    entrypoint: /usr/local/bin/nginx-entrypoint.sh

  scalelite-recordings:
    image: ${SCALELITE_RECORDINGS_DOCKER_IMAGE:-bigbluebutton/bbb-playback-proxy:jammy-300-alpine}
    container_name: scalelite-recordings
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./log/scalelite-recordings/:/var/log/nginx
      - ${SCALELITE_RECORDING_DIR:-/mnt/scalelite-recordings/var/bigbluebutton}/published:/var/bigbluebutton/published
    depends_on:
      - scalelite-api

  scalelite-api:
    image: ${SCALELITE_DEV_IMAGE:-scalelite-dev:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.scalelite-dev
    container_name: scalelite-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - URL_HOST=${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}
      - ANALYTICS_CALLBACK_URL_HOST=${ANALYTICS_CALLBACK_URL_HOST:-${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/scalelite?pool=5}
      - RECORDING_DISABLED=${RECORDING_DISABLED:-false}
      - SERVER_ID_IS_HOSTNAME=${SERVER_ID_IS_HOSTNAME:-false}
      - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT:-false}
      - RAILS_ENV=${RAILS_ENV:-development}
    volumes:
      - ./log/scalelite-api/:/srv/scalelite/log/
      - ${SCALELITE_RECORDING_DIR:-/mnt/scalelite-recordings/var/bigbluebutton}:/var/bigbluebutton
      - ./data/scalelite-api:/srv/scalelite:delegated
    depends_on:
      - postgres
      - redis
    command: /bin/sh -c "mkdir -p /srv/scalelite/tmp/cache /srv/scalelite/tmp/pids && rm -f /srv/scalelite/tmp/pids/server.pid && bundle install && bundle exec rails server -b 0.0.0.0"
    logging:
      driver: journald

  scalelite-poller:
    image: ${SCALELITE_DEV_IMAGE:-scalelite-dev:local}
    container_name: scalelite-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - URL_HOST=${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}
      - ANALYTICS_CALLBACK_URL_HOST=${ANALYTICS_CALLBACK_URL_HOST:-${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SERVER_ID_IS_HOSTNAME=${SERVER_ID_IS_HOSTNAME:-false}
      - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT:-false}
    volumes:
      - ./log/scalelite-poller/:/app/log
      - ./data/scalelite-api:/srv/scalelite:delegated
    command: /bin/sh -c "bundle install && bin/start-poller"
    depends_on:
      - scalelite-api
      - redis
    logging:
      driver: journald

  scalelite-recording-importer:
    image: ${SCALELITE_DEV_IMAGE:-scalelite-dev:local}
    container_name: scalelite-recording-importer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - URL_HOST=${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}
      - ANALYTICS_CALLBACK_URL_HOST=${ANALYTICS_CALLBACK_URL_HOST:-${SL_HOST:-sl}.${DOMAIN_NAME:-user.blindside-ps.dev}}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/scalelite?pool=5}
      - RECORDING_DISABLED=false
      - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT:-false}
    volumes:
      - ./log/scalelite-recording-importer/:/app/log
      - ${SCALELITE_RECORDING_DIR:-/mnt/scalelite-recordings/var/bigbluebutton}:/var/bigbluebutton
      - ${SCALELITE_RECORDING_DIR:-/mnt/scalelite-recordings/var/bigbluebutton}/spool:/var/bigbluebutton/spool
      - ./data/scalelite-api:/srv/scalelite:delegated
    command: /bin/sh -c "bundle install && bin/start-recording-importer"
    depends_on:
      - postgres
      - redis
      - scalelite-api
    logging:
      driver: journald
